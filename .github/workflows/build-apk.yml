name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        working-directory: anime-apk
        run: npm install

      - name: Create Android project
        working-directory: anime-apk
        run: npx cap add android

      - name: Apply native external-player plugin
        working-directory: anime-apk
        run: |
          PKG=android/app/src/main/java/com/hda/anime
          mkdir -p "$PKG"
          cp android-overlay/ExternalPlayerPlugin.java android-overlay/MainActivity.java "$PKG/"
          mkdir -p android/app/src/main/res/xml
          cp android-overlay/file_paths.xml android/app/src/main/res/xml/file_paths.xml
          grep -q "fileprovider" android/app/src/main/AndroidManifest.xml || python3 android-overlay/add_provider.py

      - name: Sync Capacitor
        working-directory: anime-apk
        run: npx cap sync android

      - name: Build debug APK
        working-directory: anime-apk/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: anime-library-apk
          path: anime-apk/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
